services:
  - type: web
    name: leadflow-alain
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/tmp/leadflow.db
      - key: JWT_SECRET
        generateValue: true
